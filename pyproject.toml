[project]
name = "roborollout-vla"
version = "0.1.0"
description = "Off-the-shelf infrastructure for running policies with RoboRollout"
readme = "README.md"
authors = [
    { name = "Abhay D", email = "a.deshpande012@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "robo-rollout @ git+https://github.com/abhaybd/RoboRollout.git@c0f6123dfc4bf37410b444b42bb1f989bc64f4a8",
]

# Each extra pulls in one policy implementation. They have incompatible pins (python, jax, numpy, transformers, openpi),
# so install only one per environment.
[project.optional-dependencies]
openpi = [
    "openpi @ git+https://github.com/Physical-Intelligence/openpi.git@215abfb217dbac7d5f1273282331b9b1866c0479",
]
molmobot = [
    "molmobot[eval] @ git+https://github.com/allenai/MolmoBot.git@33c0ca77bf6062a23d60ffd4a6859334c4a46d30#subdirectory=MolmoBot",
]
molmobot-pi0 = [
    "molmobot-pi0 @ git+https://github.com/allenai/MolmoBot.git@33c0ca77bf6062a23d60ffd4a6859334c4a46d30#subdirectory=MolmoBot-Pi0",
]
# lerobot with the dependencies of all of its policies. lerobot requires python 3.12+, unlike the MolmoBot extras.
lerobot = [
    "lerobot[diffusion,eo1,evo1,fastwam,groot,lingbot_va,molmoact2,multi_task_dit,peft,pi,smolvla,wallx,xvla]>=0.6.1,<0.7; python_version >= '3.12'",
    # otherwise uv reuses the other extras' torch 2.7, whose default (CUDA 12.6) build doesn't support Blackwell GPUs
    "torch>=2.8; python_version >= '3.12'",
]

[project.scripts]
serve-openpi = "roborollout_vla.policies.openpi:main"
serve-molmobot = "roborollout_vla.policies.molmobot:main"
serve-molmobot-pi0 = "roborollout_vla.policies.molmobot_pi0:main"
serve-lerobot = "roborollout_vla.policies.lerobot:main"
patch-transformers-for-openpi = "roborollout_vla.patch_transformers:main"

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
conflicts = [
    [
        { extra = "openpi" },
        { extra = "molmobot" },
        { extra = "molmobot-pi0" },
        { extra = "lerobot" },
    ],
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
